<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="logopng.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auth</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>

<div class="auth-wrapper">

  <!-- LEFT VIDEO -->
  <div class="auth-image">
    <video class="auth-video" autoplay muted loop playsinline>
      <source src="sign up.mp4" type="video/mp4">
    </video>
  </div>

  <!-- FORM -->
<div class="auth-form">
  <h1 id="formTitle"></h1>
  <p class="small-text" id="toggleText"></p>

  <form id="authForm">
    <input type="text" id="nameField" name="from_name" placeholder="Full Name">
    <input type="email" id="emailField" name="from_email" placeholder="Email Address" required>
    <input type="password" id="passwordField" placeholder="Password" required>

    <!-- TERMS -->
    <label class="terms">
      <label class="terms-check">
        <input type="checkbox" id="acceptTerms">
        <span class="checkmark"></span>
        <span class="terms-text">
          I agree to the
          <a href="https://policies.google.com/terms" target="_blank">Terms of Service</a>
          and
          <a href="https://policies.google.com/privacy" target="_blank">Privacy Policy</a>.
        </span>
      </label>
    </label>

    <button type="submit" id="submitBtn"></button>
    <p id="formMessage" style="display:none;"></p>
  </form>
</div>

<!-- =========================
     EMAILJS SDK
========================= -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
  // =========================
  // INITIALIZE EMAILJS
  // =========================
  emailjs.init("r4oowBPgX5r_htCa"); // Public Key

  // =========================
  // MODE FROM URL (login/signup)
  // =========================
  const params = new URLSearchParams(window.location.search);
  const mode = params.get("mode") === "login" ? "login" : "signup";

  // =========================
  // INIT UI
  // =========================
  const formTitle = document.getElementById("formTitle");
  const toggleText = document.getElementById("toggleText");
  const nameField = document.getElementById("nameField");
  const submitBtn = document.getElementById("submitBtn");
  const terms = document.querySelector(".terms");
  const authForm = document.getElementById("authForm");
  const formMessage = document.getElementById("formMessage");

  function initAuthUI() {
    if (mode === "login") {
      formTitle.innerHTML = "Log in to your<br><span>Client Space</span>";
      toggleText.innerHTML = `No account? <a href="?mode=signup">Sign up</a>`;
      nameField.style.display = "none";
      terms.style.display = "none";
      submitBtn.innerHTML = `Login →`;
    } else {
      formTitle.innerHTML = "Let’s get started<br><span>Create your account in seconds</span>";
      toggleText.innerHTML = `Already have an account? <a href="?mode=login">Login</a>`;
      nameField.style.display = "block";
      terms.style.display = "flex";
      submitBtn.innerHTML = `Start Creating →`;
    }
  }
  initAuthUI();

  // =========================
  // FORM SUBMISSION
  // =========================
  authForm.addEventListener("submit", function(e) {
    e.preventDefault();

    const name = nameField.value || "N/A";
    const email = document.getElementById("emailField").value;
    const password = document.getElementById("passwordField").value;
    const accepted = document.getElementById("acceptTerms") ? document.getElementById("acceptTerms").checked : true;

    // ===== SIGNUP =====
    if (mode === "signup") {
      if (!accepted) {
        formMessage.style.display = "block";
        formMessage.style.color = "red";
        formMessage.textContent = "❌ You must accept the Terms and Privacy Policy.";
        return;
      }

      // Save user locally
      const user = { name, email, password };
      localStorage.setItem("client_user", JSON.stringify(user));
      localStorage.setItem("client_logged", "true");
      localStorage.setItem("client_name", name);

      // Send email via EmailJS
      emailjs.send("service_dvtnhwf", "template_1ywu0af", {
        from_name: name,
        from_email: email,
        mode: mode,
        message: "User signed up"
      })
      .then(function(response){
        formMessage.style.display = "block";
        formMessage.style.color = "green";
        formMessage.textContent = "✅ Signup successful! Please choose a service.";
        authForm.reset();
        window.location.href = "services.html";
      })
      .catch(function(error){
        formMessage.style.display = "block";
        formMessage.style.color = "red";
        formMessage.textContent = "❌ Something went wrong. Please try again.";
        console.error("EmailJS error:", error);
      });

    } 
    // ===== LOGIN =====
    else {
      const storedUser = JSON.parse(localStorage.getItem("client_user"));

      if (!storedUser || storedUser.email !== email || storedUser.password !== password) {
        formMessage.style.display = "block";
        formMessage.style.color = "red";
        formMessage.textContent = "❌ Invalid email or password";
        return;
      }

      localStorage.setItem("client_logged", "true");

      // Send email via EmailJS
      emailjs.send("service_dvtnhwf", "template_1ywu0af", {
        from_name: storedUser.name,
        from_email: email,
        mode: mode,
        message: "User logged in"
      })
      .then(function(response){
        formMessage.style.display = "block";
        formMessage.style.color = "green";
        formMessage.textContent = "✅ Login successful!";
        authForm.reset();
        nameField.style.display = "none";

        const service = localStorage.getItem("selected_service");
        window.location.href = service ? "dashboard.html" : "services.html";
      })
      .catch(function(error){
        formMessage.style.display = "block";
        formMessage.style.color = "red";
        formMessage.textContent = "❌ Something went wrong. Please try again.";
        console.error("EmailJS error:", error);
      });
    }
  });
</script>


</body>
</html>
