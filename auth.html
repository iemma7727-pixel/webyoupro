<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auth</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>

<div class="auth-wrapper">

  <!-- LEFT IMAGE / VIDEO -->
  <div class="auth-image">
    <video class="auth-video" autoplay muted loop playsinline>
      <source src="sign up.mp4" type="video/mp4">
    </video>
  </div>

  <!-- RIGHT FORM -->
  <div class="auth-form">
    <h1 id="formTitle">
      Let’s get started<br>
      <span>create your account in seconds</span>
    </h1>

    <p class="small-text" id="toggleText">
      Already have an account?
      <a href="#" onclick="toggleMode()">Log in</a>
    </p>

    <form id="authForm">
      <input type="text" id="nameField" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="password" name="password" placeholder="Password" required>

      <!-- hidden service fields -->
      <input type="hidden" id="selectedService">
      <input type="hidden" id="selectedPrice">
      <input type="hidden" id="selectedDuration">

      <button type="submit" id="submitBtn">
        Start Creating <span class="arrow">→</span>
      </button>
    </form>

    <p class="terms">
      By signing in, you agree to our
      <a href="https://policies.google.com/privacy" target="_blank">Privacy Policy</a>
      and
      <a href="https://policies.google.com/terms" target="_blank">Terms of Service</a>.
    </p>
  </div>

</div>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
emailjs.init("-r4oowBPgX5r_htCa"); // 🔑 EmailJS key

/* ===== MODE ===== */
let mode = "signup";

/* ===== TOGGLE MODE ===== */
function toggleMode() {
  const title = document.getElementById("formTitle");
  const toggle = document.getElementById("toggleText");
  const nameField = document.getElementById("nameField");
  const submitBtn = document.getElementById("submitBtn");

  if (mode === "signup") {
    // 👉 LOGIN MODE
    mode = "login";

    title.innerHTML = "Log in to your<br><span>Client Space</span>";
    toggle.innerHTML = `No account? <a href="#" onclick="toggleMode()">Sign up</a>`;

    nameField.style.display = "none";
    nameField.removeAttribute("required");

    submitBtn.innerHTML = `Log in <span class="arrow">→</span>`;

  } else {
    // 👉 SIGNUP MODE
    mode = "signup";

    title.innerHTML = "Let’s get started<br><span>create your account in seconds</span>";
    toggle.innerHTML = `Already have an account? <a href="#" onclick="toggleMode()">Log in</a>`;

    nameField.style.display = "block";
    nameField.setAttribute("required", "true");

    submitBtn.innerHTML = `Start Creating <span class="arrow">→</span>`;
  }
}

/* ===== LOAD SERVICE ===== */
const serviceData = JSON.parse(localStorage.getItem("selected_service"));
if(serviceData){
  document.getElementById("selectedService").value = serviceData.name;
  document.getElementById("selectedPrice").value = serviceData.price;
  document.getElementById("selectedDuration").value = serviceData.duration;
}

/* ===== FORM SUBMIT ===== */
document.getElementById("authForm").addEventListener("submit", function(e){
  e.preventDefault();

  const name = document.getElementById("nameField").value;
  const email = document.querySelector('input[name="email"]').value;
  const password = document.querySelector('input[name="password"]').value;

  const service = document.getElementById("selectedService").value;
  const price = document.getElementById("selectedPrice").value;
  const duration = document.getElementById("selectedDuration").value;

  /* ===== SIGNUP ===== */
  if(mode === "signup"){

    if(!service){
      alert("❌ Please select a service first");
      window.location.href = "services.html";
      return;
    }

    const user = { name, email, password, service, price, duration };

    localStorage.setItem("client_user", JSON.stringify(user));
    localStorage.setItem("client_logged", "true");
    localStorage.setItem("client_name", name);

    emailjs.send(
      "service_dvtnhwf",
      "template_1ywu0af",
      { name, email, service, price, duration }
    ).catch(()=>{});

    window.location.href = "dashboard.html";
  }

  /* ===== LOGIN ===== */
  else{
    const storedUser = JSON.parse(localStorage.getItem("client_user"));

    if(storedUser && storedUser.email === email && storedUser.password === password){
      localStorage.setItem("client_logged","true");
      localStorage.setItem("client_name", storedUser.name);

      localStorage.setItem("selected_service", JSON.stringify({
        name: storedUser.service,
        price: storedUser.price,
        duration: storedUser.duration
      }));

      window.location.href = "dashboard.html";
    } else {
      alert("❌ Invalid email or password");
    }
  }
});
</script>

</body>
</html>
