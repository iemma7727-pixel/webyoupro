<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="logopng.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auth</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>

<div class="auth-wrapper">

  <!-- LEFT VIDEO -->
  <div class="auth-image">
    <video class="auth-video" autoplay muted loop playsinline>
      <source src="sign up.mp4" type="video/mp4">
    </video>
  </div>

  <!-- FORM -->
  <div class="auth-form">
    <h1 id="formTitle"></h1>

    <p class="small-text" id="toggleText"></p>

    <form id="authForm">
      <input type="text" id="nameField" placeholder="Full Name">
      <input type="email" id="emailField" placeholder="Email Address" required>
      <input type="password" id="passwordField" placeholder="Password" required>

      <button type="submit" id="submitBtn"></button>
    </form>
  </div>

</div>

<script>
/* =========================
   MODE FROM URL
========================= */
const params = new URLSearchParams(window.location.search);
let mode = params.get("mode") === "login" ? "login" : "signup";

/* =========================
   INIT UI
========================= */
function initAuthUI() {
  const title = document.getElementById("formTitle");
  const toggle = document.getElementById("toggleText");
  const nameField = document.getElementById("nameField");
  const submitBtn = document.getElementById("submitBtn");

  if (mode === "login") {
    title.innerHTML = "Log in to your<br><span>Client Space</span>";
    toggle.innerHTML = `No account? <a href="auth.html?mode=signup">Sign up</a>`;
    nameField.style.display = "none";
    nameField.required = false;
    submitBtn.innerHTML = `Log in <span class="arrow">→</span>`;
  } else {
    title.innerHTML = "Let’s get started<br><span>Create your account in seconds</span>";
    toggle.innerHTML = `Already have an account? <a href="auth.html?mode=login">Log in</a>`;
    nameField.style.display = "block";
    nameField.required = true;
    submitBtn.innerHTML = `Start Creating <span class="arrow">→</span>`;
  }
}

initAuthUI();

/* =========================
   SUBMIT
========================= */
document.getElementById("authForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const name = document.getElementById("nameField").value;
  const email = document.getElementById("emailField").value;
  const password = document.getElementById("passwordField").value;

  const storedUser = JSON.parse(localStorage.getItem("client_user"));
  const storedService = JSON.parse(localStorage.getItem("selected_service"));

  /* ===== SIGN UP ===== */
  if (mode === "signup") {

    const user = { name, email, password };
    localStorage.setItem("client_user", JSON.stringify(user));
    localStorage.setItem("client_logged", "true");

    alert("✅ Account created successfully. Please choose a service.");
    window.location.href = "services.html";
  }

  /* ===== LOGIN ===== */
  else {

    if (!storedUser || storedUser.email !== email || storedUser.password !== password) {
      alert("❌ Invalid email or password");
      return;
    }

    localStorage.setItem("client_logged", "true");

    if (storedService) {
      window.location.href = "dashboard.html";
    } else {
      alert("⚠️ You need to choose a service first");
      window.location.href = "services.html";
    }
  }
});
</script>

</body>
</html>
