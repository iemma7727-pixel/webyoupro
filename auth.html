<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="logopng.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auth</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
<nav class="navbar" dir="rtl">
  <div class="nav-inner">

    <!-- LOGO -->
    <a href="index.html" class="logo-link">
      <img src="pn1.png" alt="Logo" class="logo">
    </a>

    <!-- MENU -->
    <ul id="nav-links" class="nav-links">
      <li><a href="services.html">Services</a></li>
      <li><a href="projet.html">Projects</a></li>
      <li><a href="company.html">Company</a></li>
      <li><a href="kontakt.html">Contact</a></li>
    </ul>

    <!-- BURGER -->
    <div class="menu-btn" onclick="toggleMenu()">☰</div>

  </div>
</nav>
<script>
function toggleMenu() {
  document.getElementById("nav-links").classList.toggle("active");
}
</script>

<div class="auth-wrapper">

  <!-- LEFT VIDEO -->
  <div class="auth-image">
    <video class="auth-video" autoplay muted loop playsinline>
      <source src="sign up.mp4" type="video/mp4">
    </video>
  </div>

  <!-- FORM -->
<div class="auth-form">
  <h1 id="formTitle">
    Let’s get started<br>
    <span>Create your account in seconds</span>
  </h1>

  <p class="small-text" id="toggleText">
    Already have an account?
    <a href="auth.html?mode=login">Log in</a>
  </p>

  <form id="authForm">
    <input type="text" id="nameField" name="from_name" placeholder="Full Name">
    <input type="email" id="emailField" name="from_email" placeholder="Email Address" required>
    <input type="password" id="passwordField" placeholder="Password" required>
<p class="small-text">
  <a href="#" id="forgotPassword">Forgot password?</a>
</p>

    <!-- TERMS -->
    <label class="terms">
      <label class="terms-check">
        <input type="checkbox" id="acceptTerms">
        <span class="checkmark"></span>
        <span class="terms-text">
          I agree to the
          <a href="https://policies.google.com/terms" target="_blank">Terms of Service</a>
          and
          <a href="https://policies.google.com/privacy" target="_blank">Privacy Policy</a>.
        </span>
      </label>
    </label>

    <button type="submit" id="submitBtn">Start Creating →</button>
    <p id="formMessage" style="display:none;"></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
/* =========================
   EMAILJS INIT
========================= */
(function () {
  emailjs.init("-r4oowBPgX5r_htCa");
})();

/* =========================
   MODE
========================= */
const params = new URLSearchParams(window.location.search);
const mode = params.get("mode") === "login" ? "login" : "signup";

/* =========================
   ELEMENTS
========================= */
const form = document.getElementById("authForm");
const nameField = document.getElementById("nameField");
const emailField = document.getElementById("emailField");
const passwordField = document.getElementById("passwordField");
const submitBtn = document.getElementById("submitBtn");
const acceptTerms = document.getElementById("acceptTerms");
const formMessage = document.getElementById("formMessage");

/* =========================
   USERS STORAGE
========================= */
function getUsers() {
  return JSON.parse(localStorage.getItem("client_users")) || [];
}
function saveUsers(users) {
  localStorage.setItem("client_users", JSON.stringify(users));
}

/* =========================
   UI MESSAGE
========================= */
function showMessage(msg, color = "red") {
  formMessage.innerText = msg;
  formMessage.style.color = color;
  formMessage.style.display = "block";
}

/* =========================
   INIT UI
========================= */
(function initAuthUI() {
  const title = document.getElementById("formTitle");
  const toggle = document.getElementById("toggleText");
  const terms = document.querySelector(".terms");

  if (mode === "login") {
    title.innerHTML = "Log in to your<br><span>Client Space</span>";
    toggle.innerHTML = `No account? <a href="auth.html?mode=signup">Sign up</a>`;
    nameField.style.display = "none";
    terms.style.display = "none";
    submitBtn.innerText = "Log in →";
  } else {
    title.innerHTML = "Let’s get started<br><span>Create your account in seconds</span>";
    toggle.innerHTML = `Already have an account? <a href="auth.html?mode=login">Log in</a>`;
    nameField.style.display = "block";
    terms.style.display = "flex";
    submitBtn.innerText = "Start Creating →";
  }
})();

/* =========================
   REMEMBER USER
========================= */
emailField.value = localStorage.getItem("client_email") || "";
nameField.value = localStorage.getItem("client_name") || "";

/* =========================
   SUBMIT
========================= */
form.addEventListener("submit", function (e) {
  e.preventDefault();

  const name = nameField.value.trim();
  const email = emailField.value.trim();
  const password = passwordField.value.trim();
  const users = getUsers();

  formMessage.style.display = "none";

  /* ===== SIGN UP ===== */
  if (mode === "signup") {

    if (!name || !email || !password) {
      showMessage("❌ Please fill all fields");
      return;
    }

    if (!acceptTerms.checked) {
      showMessage("❌ You must accept the Terms & Privacy Policy");
      return;
    }

    if (users.find(u => u.email === email)) {
      showMessage("❌ Email already registered");
      return;
    }

    const newUser = { name, email, password };
    users.push(newUser);
    saveUsers(users);

    localStorage.setItem("client_logged", "true");
    localStorage.setItem("client_name", name);
    localStorage.setItem("client_email", email);

    /* EMAIL TO YOU */
    emailjs.send("service_dvtnhwf", "template_1ywu0af", {
      to_email: "contact@webyoupro.com",
      name,
      email
    }).catch(() => console.warn("Admin email failed"));

    /* EMAIL TO CLIENT */
    emailjs.send("service_dvtnhwf", "template_j54opb5", {
      to_email: email,
      name
    }).catch(() => console.warn("Client email failed"));

    showMessage("✅ Account created successfully", "green");

    setTimeout(() => {
      window.location.href = "services.html";
    }, 800);
  }

  /* ===== LOGIN ===== */
  else {

    const user = users.find(u => u.email === email && u.password === password);

    if (!user) {
      showMessage("❌ Invalid email or password");
      return;
    }

    localStorage.setItem("client_logged", "true");
    localStorage.setItem("client_name", user.name);
    localStorage.setItem("client_email", user.email);

    window.location.href = "services.html";
  }
});

/* =========================
   FORGOT PASSWORD
========================= */
document.getElementById("forgotPassword").addEventListener("click", function () {
  const email = prompt("Enter your email");
  if (!email) return;

  const users = getUsers();
  const user = users.find(u => u.email === email);

  if (!user) {
    alert("❌ Email not found");
    return;
  }

  emailjs.send("service_dvtnhwf", "template_j54opb5", {
    to_email: email,
    name: user.name,
    message: `Your password is: ${user.password}`
  }).catch(() => alert("❌ Failed to send email"));

  alert("📩 Password sent to your email");
});
</script>


</body>
</html>
